name: Node CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:

jobs:
  test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
        env:
          CI: true
      - name: Build
        run: yarn build
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Package
        run: yarn package

  verify-manifest-usb-ids:
    name: Verify manifest USB IDs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
        env:
          CI: true
      - name: Generate USB IDs
        run: |
          yarn build:main
          yarn build:manifest-usb-ids
      - name: Verify generated files are current
        uses: infotroph/tree-is-clean@v1.0.6
        with:
          check_untracked: false
